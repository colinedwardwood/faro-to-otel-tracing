services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # uncomment once you've uncommented the alloy service below
      # alloy:
      #   condition: service_started
    env_file: .env
    ports:
      - "3000:3000"

  # Uncomment this whole service (and the alloy dependency on the app
  # service above) once you've created alloy/config.alloy — see README's
  # "Instrument it" section. Left commented out here so the baseline
  # (before instrumenting anything) still comes up as just postgres + app,
  # with nowhere to send telemetry even by accident.
  # alloy:
  #   image: grafana/alloy:latest
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     # picked up by config.alloy's resourcedetection "env" detector and
  #     # stamped onto every span/metric/log passing through Alloy
  #     OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${PUBLIC_APP_ENV}
  #   volumes:
  #     - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
  #   command:
  #     - run
  #     - --server.http.listen-addr=0.0.0.0:12345
  #     - /etc/alloy/config.alloy
  #   ports:
  #     - "12345:12345" # Alloy's own UI — a live graph of the pipeline, worth a look
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  pgdata:
